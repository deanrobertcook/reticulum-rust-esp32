[package]
name = "reticulum-rust-esp32"
version = "0.1.0"
edition = "2024"

[dependencies]
# esp-rtos = { version = "0.2.0", features = ["embassy"] }
# embassy-executor = { version = "0.10.0" }
# embassy-futures = "0.1.1"
# embassy-time = "0.5.1"
# embassy-sync = "0.8.0"
esp-hal = { version = "~1.0", features = ["esp32", "unstable", "defmt"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
esp-backtrace = { version = "0.18.1", features = [
    "esp32",
    "panic-handler",
	"defmt",
] }
# esp-alloc = "0.9.0"
# esp-rtos = { version = "0.2.0", features = [
#   "esp32",
#   "esp-alloc",
# ] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04", "defmt-espflash"] }
# log = "0.4.29"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
defmt = "1.0.1"

[features]
esp32 = [
    "esp-hal/esp32",
    # "esp-wifi-hal/esp32",
    # "esp-rtos/esp32",
    # "esp-backtrace/esp32",
    # "esp-bootloader-esp-idf/esp32"
]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"
